name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            id: linux
          - os: windows-latest
            id: windows
          - os: macos-latest
            id: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libxkbcommon-x11-0 libfuse2
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Instalar
        run: |
          python -m pip install -U pip
          pip install -e ".[packaging]"
      - name: Empacotar
        env:
          GESTOR_RPG_VERSION: ${{ github.ref_name }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python packaging/package-release.py
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: gestor-rpg-${{ matrix.id }}
          path: dist/upload/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(python3 - <<PY
          from pathlib import Path
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          parts = text.split("## [")
          body = ""
          for part in parts[1:]:
              if part.startswith("${version}"):
                  body = "## [" + part.split("## [")[0]
                  break
          print(body.strip() or f"Gestor RPG {version}")
          PY
          )
          mapfile -t files < <(find artifacts -type f | sort)
          gh release create "$GITHUB_REF_NAME" \
            --title "Gestor RPG ${version}" \
            --notes "$notes" \
            --latest \
            "${files[@]}"
        shell: bash
